<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <title>Weather App</title>
</head>

<body>
  <div class="big-box">
    <div class="weather">
      <h1 class="head">Weather App</h1>

      <div class="btn-holder">
        <input type="text" id="city-input" placeholder="Enter city name" />
        <button id="city-input-btn">Get Weather</button>
      </div>

      <div id="weather-info">
        <h3 id="city-name"></h3>
        <p id="date"></p>
        <img id="weather-icon" src="images/4102320_cloud_heavy rain_rain_weather_icon.png" alt="Weather Icon" />
        <p id="temperature"></p>
        <button id="temp-toggle">°C / °F</button>
        <p id="description"></p>
        <p id="wind-speed"></p>
      </div>
    </div>
  </div>

  <script src="weather.js"></script>
</body>

</html>
