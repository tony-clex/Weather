<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="big-box">
    <h1>Weather App</h1>
    <div class="search">
      <input type="text" id="city-input" placeholder="Enter city name">
      <button id="city-input-btn">Go</button>
    </div>
    <button id="temp-toggle">Toggle °C/°F</button>

    <div id="weather-info">
      <h2 id="city-name"></h2>
      <p id="date"></p>
      <p id="description"></p>
      <div class="icon-wrapper">
        <img id="weather-icon" alt="weather icon">
      </div>
      <p id="wind-speed"></p>
      <p id="temperature"></p>
    </div>
  </div>

  <script src="weather.js"></script>
</body>
</html>
